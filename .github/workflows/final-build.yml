name: Final build quality gates
on:
  push:
    branches: [architecture-review-20260926]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          sudo apt-get update && sudo apt-get install -y libopus-dev libsdl2-dev ffmpeg
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Vendored SCTP protocol tests
        run: cargo test --manifest-path vendor/rtc-sctp/Cargo.toml --lib --target x86_64-unknown-linux-gnu -- --test-threads=1
      - name: Host tests and strict Clippy
        env:
          SDL_VIDEODRIVER: dummy
        run: python3 tools/run_host_audit.py --output verification/host --clippy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-gate-evidence
          path: verification/host
  vita:
    needs: host
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-feature=-neon"
      GREENVITA_BUILD_NUMBER: "HA05-${{ github.run_number }}"
      GREENVITA_BUILD_SHA: ${{ github.sha }}
    container:
      image: ghcr.io/vita-rust/vitasdk-rs@sha256:351f167c6c0c502baf92502b779cc4b52e9f82ac83efd172911c3ce37b3199cc
    steps:
      - uses: actions/checkout@v4
      - name: Check target and test compilation
        run: make native-check
      - name: Strict target Clippy
        run: make native-clippy
      - name: Compile native release executable
        run: cargo build --release --locked -Zbuild-std=std,panic_abort
      - name: Package hardware acceptance candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/architecture-review-20260926' && contains(github.event.head_commit.message, '[hardware-acceptance-vpk]')
        run: |
          make vpk
          python3 tools/check_vita_elf.py target/armv7-sony-vita-newlibeabihf/release/green-vita.elf
      - name: Verify packaged identity and source provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/architecture-review-20260926' && contains(github.event.head_commit.message, '[hardware-acceptance-vpk]')
        env:
          GREENVITA_SDK_IMAGE: ghcr.io/vita-rust/vitasdk-rs@sha256:351f167c6c0c502baf92502b779cc4b52e9f82ac83efd172911c3ce37b3199cc
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          python3 tools/build_provenance.py target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk --revision "$GITHUB_SHA" --number "$GREENVITA_BUILD_NUMBER" --hardware-acceptance --checkout > acceptance-provenance.json
          sha256sum target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk > acceptance-sha256.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/architecture-review-20260926' && contains(github.event.head_commit.message, '[hardware-acceptance-vpk]')
        with:
          name: GreenVita-HA05-${{ github.sha }}
          path: |
            target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk
            acceptance-provenance.json
            acceptance-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gate-evidence
          path: target/armv7-sony-vita-newlibeabihf/release/green-vita.elf
          if-no-files-found: warn
