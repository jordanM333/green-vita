name: Hardware acceptance VPK fc1d008
on:
  push:
    branches: [hardware-acceptance-fc1d008]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vita-rust/vitasdk-rs@sha256:351f167c6c0c502baf92502b779cc4b52e9f82ac83efd172911c3ce37b3199cc
    env:
      RUSTFLAGS: "-C target-feature=-neon"
      GREENVITA_BUILD_NUMBER: DIAG03-HA1
      GREENVITA_BUILD_SHA: fc1d008dc0e5279c87c0db2bb24dc5b3fda18d4a
      GREENVITA_SDK_IMAGE: ghcr.io/vita-rust/vitasdk-rs@sha256:351f167c6c0c502baf92502b779cc4b52e9f82ac83efd172911c3ce37b3199cc
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Verify existing exact-source quality gates
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 36373716863});
            if (r.data.head_sha !== process.env.GREENVITA_BUILD_SHA || r.data.conclusion !== 'success') throw new Error('Exact-source quality gates are not green');
      - uses: actions/checkout@v4
        with:
          ref: fc1d008dc0e5279c87c0db2bb24dc5b3fda18d4a
      - name: Assert exact unchanged source
        run: |
          test "$(git rev-parse HEAD)" = "$GREENVITA_BUILD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "45d887f1126781e34f3754bb7dffbe937b6fe245"
          test -z "$(git status --porcelain)"
      - name: Package hardware acceptance VPK with pinned SDK
        run: make vpk
      - name: Verify final package and source provenance
        run: |
          python3 tools/check_vita_elf.py target/armv7-sony-vita-newlibeabihf/release/green-vita.elf
          python3 tools/build_provenance.py target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk --revision "$GREENVITA_BUILD_SHA" --number "$GREENVITA_BUILD_NUMBER" --diagnostic --checkout > hardware-acceptance-provenance.json
          sha256sum target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk > hardware-acceptance-sha256.txt
          test -z "$(git diff --name-only HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: GreenVita-hardware-acceptance-fc1d008
          path: |
            target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk
            target/armv7-sony-vita-newlibeabihf/release/green-vita.elf
            hardware-acceptance-provenance.json
            hardware-acceptance-sha256.txt
          if-no-files-found: error
          retention-days: 30
